# ============================================================
#  inmc-invkeeper — 사망 처리 · 무덤 · 영혼각인
# ============================================================
# 아이템(보호권·각인 도구·도굴 도구)은 items.yml 에서 설정합니다.

# keepInventory 게임룰 강제 고정.
# true 면 플러그인 로드 / 월드 로드 때마다 모든 월드의 keepInventory 를 false 로 되돌립니다.
# 이 플러그인이 드랍을 직접 계산하므로, 게임룰이 켜져 있으면 인벤토리가 복제됩니다.
force-keep-inventory-false: true

# 영혼각인 만료 검사를 몇 개의 배치로 나눌지.
# 매초 접속자를 이 수만큼의 그룹으로 나눠 한 그룹씩만 검사합니다.
# (5 면 100명일 때 매초 20명씩, 5초에 전원을 한 바퀴)
#
# 올리면 한 틱 부하가 줄고 만료 반영이 최대 이 값(초)만큼 늦어집니다.
# 각인 만료가 몇 초 늦어도 게임플레이에 지장이 없으므로, 인원이 많을수록 올리세요.
#
#   ~20명 : 1   /  ~50명 : 3  /  ~100명 : 5  /  ~200명 : 8~10  /  ~500명 : 15~20
#
# 1 미만은 1 로 보정됩니다.
soulbind-scan-batches: 5

# 각인 만료 시각 표시에 쓸 시간대.
# https://en.wikipedia.org/wiki/List_of_tz_database_time_zones 의 TZ database name
timezone: "Asia/Seoul"

# 아이템 하나에 줄 수 있는 최대 각인 스택.
# 각인 도구의 soulbind-stacks 가 이 값보다 크면 이 값으로 잘립니다.
#   -1 : 무제한 (기본)
max-soulbind-stack: -1

# 남의 각인 아이템을 주우려 할 때 메시지 쿨다운 (초). 0 이면 매번 표시.
soulbind-pickup-message-cooldown-seconds: 5

# 남의 각인 아이템을 쓰려 할 때(우클릭·채굴·설치·공격 등) 메시지 쿨다운 (초). 0 이면 매번 표시.
soulbind-use-message-cooldown-seconds: 3

# ============================================================
#  드랍 규칙 — 죽을 때 얼마를 잃는가
# ============================================================
# 0 은 완전 보호, 100 은 전부 드랍입니다.
#
# 월드 규칙은 **priority 0 인 후보로 경쟁에 참가**합니다. 아래 권한 규칙은 전부 priority
# 10 이상이므로, **권한을 가진 사람은 월드와 무관하게 그 권한의 드랍량을 따릅니다.**
# 이것이 의도된 사양입니다 - 등급(권한)이 월드보다 강한 결정권을 갖습니다.
# 특정 월드를 권한보다 우선하고 싶다면 그 월드에서만 해당 권한을 빼세요.
rules:
  world:
    default:        { inventory-drop-percent: 0,   exp-drop-percent: 0 }
    world:          { inventory-drop-percent: 50,  exp-drop-percent: 50 }
    world_nether:   { inventory-drop-percent: 70,  exp-drop-percent: 70 }
    world_the_end:  { inventory-drop-percent: 100, exp-drop-percent: 100 }

  # priority 가 높은 규칙 하나만 적용됩니다. 같은 priority 를 두 번 쓰면 로드 때 경고가 납니다.
  permissions:
    - { permission: "invkeeper.drop.1",  priority: 10,  inventory-drop-percent: 100, exp-drop-percent: 100 }
    - { permission: "invkeeper.drop.2",  priority: 20,  inventory-drop-percent: 90,  exp-drop-percent: 90 }
    - { permission: "invkeeper.drop.3",  priority: 30,  inventory-drop-percent: 80,  exp-drop-percent: 80 }
    - { permission: "invkeeper.drop.4",  priority: 40,  inventory-drop-percent: 70,  exp-drop-percent: 70 }
    - { permission: "invkeeper.drop.5",  priority: 50,  inventory-drop-percent: 60,  exp-drop-percent: 60 }
    - { permission: "invkeeper.drop.6",  priority: 60,  inventory-drop-percent: 50,  exp-drop-percent: 50 }
    - { permission: "invkeeper.drop.7",  priority: 70,  inventory-drop-percent: 40,  exp-drop-percent: 40 }
    - { permission: "invkeeper.drop.8",  priority: 80,  inventory-drop-percent: 30,  exp-drop-percent: 30 }
    - { permission: "invkeeper.drop.9",  priority: 90,  inventory-drop-percent: 20,  exp-drop-percent: 20 }
    - { permission: "invkeeper.drop.10", priority: 95,  inventory-drop-percent: 10,  exp-drop-percent: 10 }
    - { permission: "invkeeper.drop.11", priority: 100, inventory-drop-percent: 0,   exp-drop-percent: 0 }

# ============================================================
#  무덤
# ============================================================
# 사망 시 잃는 몫을 바닥에 흩뿌리는 대신 사망 지점의 무덤에 담습니다.
# 위 rules 는 "얼마나 잃는지" 계산에 그대로 쓰이고, 잃는 몫의 행선지만 바뀝니다.
#
# 주인은 언제든 우클릭해 회수할 수 있고, 다른 사람은 도굴 도구(items.yml 의
# kind: GRAVE_LOOT_TOOL)로 일정 시간 시전해야 엽니다. 도굴 중에 주인이 무덤을 열면
# 도굴은 자동으로 취소됩니다.
grave:
  # false 면 무덤을 만들지 않고 예전처럼 바닥에 드랍합니다.
  enabled: true

  container:
    # VANILLA        : 아래 vanilla-material 을 놓습니다.
    # CUSTOM_BLOCK   : ItemsAdder 등 커스텀 블록. custom-block-provider / custom-block-id 를 씁니다.
    type: VANILLA
    # 장식용 블록입니다. 아이템은 이 블록의 인벤토리가 아니라 플러그인이 관리하는
    # 가상 화면에 담기므로, 후퍼가 빨아갈 실제 내용물이 없습니다.
    vanilla-material: BARREL
    custom-block-id: ""
    custom-block-provider: ""

  # 1인당 동시에 존재할 수 있는 무덤 수. 넘으면 가장 오래된 것을 정리(히스토리에는 남김)합니다.
  # 0 이하면 무제한.
  max-graves-per-player: 5

  expire:
    # false 면 무덤이 시간으로 사라지지 않습니다.
    enabled: true
    # 생성 후 이 시간(초)이 지나면 사라집니다. 0 또는 -1 이면 만료 없음.
    default-seconds: 3600
    # 권한별 덮어쓰기. priority 가 가장 높은 하나만 적용됩니다.
    permission-overrides:
      - { permission: "invkeeper.grave.time.vip",  priority: 10, seconds: 7200 }
      - { permission: "invkeeper.grave.time.vvip", priority: 20, seconds: -1 }

  # /인벤키퍼 무덤 기록 <플레이어> 로 어드민이 보는 이력입니다.
  # 무덤이 사라질 때(전량 회수 / 도굴 완료 / 만료) 사망 시점 스냅샷과 회수 상태가 남습니다.
  history:
    # 보관 기간(일). 0 이하면 기간 제한 없음.
    retention-days: 30
    # 1인당 최대 기록 수. 넘으면 오래된 순으로 지웁니다. 0 이하면 개수 제한 없음.
    max-entries-per-player: 50

  # 무덤을 만들지 않을 월드 (대소문자 구분 없음). 여기서 죽으면 rules 대로 바닥에 드랍됩니다.
  disabled-worlds: []

  # 무덤 위 홀로그램 (TextDisplay)
  hologram:
    enabled: true
    offset-y: 1.0
    # 갱신 주기(틱). 20 = 1초. 낮출수록 부하가 늡니다.
    update-interval-ticks: 20
    # {player} 무덤 주인 / {remaining} 남은 만료 시간
    line-format: "{player} 의 무덤 {remaining}"
    # 만료가 무제한일 때. {player}
    line-format-unlimited: "{player} 의 무덤"
    # 도굴 시전 중 둘째 줄. {remaining} 도굴 완료까지
    looting-line-format: "도굴중 {remaining}"
    # 도굴 완료 후 둘째 줄. {looter} 도굴한 사람 / {owner} 주인
    looted-line-format: "{looter}님이 도굴을 한 {owner}의 무덤"

  # 무덤 블록 보호.
  protection:
    prevent-block-break: true
    prevent-explosion: true
    prevent-piston: true
    # 커스텀 블록 제공자가 진짜 컨테이너를 놓는 경우를 위한 것입니다.
    # 바닐라 무덤 블록은 장식이라 빨아갈 내용물이 애초에 없습니다.
    prevent-hopper: true
